/* Squarify */
function squarify(items,x,y,w,h){if(!items.length)return[];return _layout(items.map(i=>({...i})),x,y,w,h);}
function _layout(items,x,y,w,h){if(!items.length)return[];if(items.length===1)return[{...items[0],x,y,w,h}];const tot=items.reduce((s,i)=>s+i.a,0);let best=1,bR=Infinity;for(let n=1;n<=items.length;n++){const r=_worst(items.slice(0,n),w,h,tot);if(r<bR){bR=r;best=n;}else break;}const row=items.slice(0,best),rest=items.slice(best);const rA=row.reduce((s,i)=>s+i.a,0),frac=rA/tot;let rects,nx,ny,nw,nh;if(w>=h){const cw=w*frac;rects=_place(row,x,y,cw,h,false);nx=x+cw;ny=y;nw=w-cw;nh=h;}else{const rh=h*frac;rects=_place(row,x,y,w,rh,true);nx=x;ny=y+rh;nw=w;nh=h-rh;}if(!rest.length)return rects;const na=nw*nh,rt=rest.reduce((s,i)=>s+i.a,0);return[...rects,..._layout(rest.map(i=>({...i,a:i.a/rt*na})),nx,ny,nw,nh)];}
function _worst(row,w,h,tot){const rA=row.reduce((s,i)=>s+i.a,0),side=w>=h?h:w,rW=rA/tot*(w>=h?w:h);return row.reduce((m,i)=>{const iH=(i.a/rA)*side;return Math.max(m,Math.max(rW/iH,iH/rW));},0);}

  const sorted=[...GROUPS].sort((a,b)=>a.order-b.order);
  const visible=showMore?sorted:sorted.filter(g=>g.show);
  const all=document.createElement('button');all.className='cbtn all-cbtn'+(activeCat==='all'?' on':'');all.textContent=t().all;
  all.onclick=()=>{activeCat='all';buildCatBar();render();};bar.appendChild(all);
  visible.forEach(g=>{
    const b=document.createElement('button');b.className='cbtn'+(activeCat===g.id?' on':'');b.style.background=g.color;b.textContent=t().groups[g.id];
    b.onclick=()=>{activeCat=g.id;buildCatBar();render();};bar.appendChild(b);
  });
  if(sorted.some(g=>!g.show)){const m=document.createElement('button');m.className='more-cbtn';m.textContent=showMore?t().less:t().more;m.onclick=()=>{showMore=!showMore;buildCatBar();};bar.appendChild(m);}
}

function render(){
  const container=document.getElementById('map');container.innerHTML='';
  const W=container.offsetWidth||window.innerWidth;const H=container.offsetHeight||500;
  let data=coins.filter(c=>c[metric]!=null&&Math.abs(c[metric])>0);
  if(activeCat!=='all')data=data.filter(c=>gId(c.id)===activeCat);
  if(!data.length){container.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#475569;font-size:14px">${t().noCoins}</div>`;return;}
  data.sort((a,b)=>Math.abs(b[metric])-Math.abs(a[metric]));
  const tot=data.reduce((s,c)=>s+Math.abs(c[metric]),0);
  const items=data.map(c=>({coin:c,a:Math.abs(c[metric])/tot*W*H}));
  const rects=squarify(items,0,0,W,H);
  const tip=document.getElementById('tip');
  rects.forEach(r=>{
    const c=r.coin,ch=c.price_change_percentage_24h||0;
    const el=document.createElement('div');el.className='tile';
    el.style.cssText=`left:${r.x+.5}px;top:${r.y+.5}px;width:${Math.max(r.w-1,2)}px;height:${Math.max(r.h-1,2)}px;background:${gColor(c.id)};border-bottom:3px solid ${chColor(ch)}`;
    const minD=Math.min(r.w,r.h);
    if(minD>24){const s=document.createElement('div');s.className='t-sym';s.style.fontSize=Math.min(Math.max(minD*.24,10),22)+'px';s.textContent=c.symbol.toUpperCase();el.appendChild(s);}
    if(minD>42){const v=document.createElement('div');v.className='t-val';v.style.fontSize=Math.min(Math.max(minD*.16,9),14)+'px';v.textContent=fmtNum(c,metric);el.appendChild(v);}
    if(minD>64&&metric!=='price_change_percentage_24h'){const cv=c.price_change_percentage_24h||0;const ce=document.createElement('div');ce.className='t-chg';ce.style.fontSize=Math.min(Math.max(minD*.14,8),12)+'px';ce.style.color=chColor(cv)+'dd';ce.textContent=(cv>=0?'▲':'▼')+Math.abs(cv).toFixed(2)+'%';el.appendChild(ce);}
    if(minD>80&&activeCat==='all'){const cat=document.createElement('div');cat.className='t-cat';cat.textContent=gLabel(c.id);el.appendChild(cat);}
    el.addEventListener('mouseenter',()=>{
      const cv=c.price_change_percentage_24h||0;tip.style.display='block';
      tip.innerHTML=`<div class="tt-hd">${c.name}<span style="color:#475569;font-size:11px;font-weight:400">${c.symbol.toUpperCase()}</span><span class="tt-badge" style="background:${gColor(c.id)};margin-left:auto">${gLabel(c.id)}</span></div><div class="tt-r"><span>${t().tip.price}</span><span class="tt-v">${fmtNum(c,'current_price')}</span></div><div class="tt-r"><span>${t().tip.mcap}</span><span class="tt-v">${fmtNum(c,'market_cap')}</span></div><div class="tt-r"><span>${t().tip.chg}</span><span class="tt-v" style="color:${chColor(cv)}">${(cv>=0?'+':'')+cv.toFixed(2)+'%'}</span></div><div class="tt-r"><span>${t().tip.vol}</span><span class="tt-v">${fmtNum(c,'total_volume')}</span></div>`;
    });
    el.addEventListener('mousemove',e=>{tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-10)+'px';});
    el.addEventListener('mouseleave',()=>tip.style.display='none');
    container.appendChild(el);
  });
}

async function load(){
  const status=document.getElementById('status');status.textContent=t().loading;
  try{
    const r=await fetch(API_URL);if(!r.ok)throw 0;
    coins=await r.json();coins.forEach(c=>{if(!CMAP[c.id])CMAP[c.id]='other';});
    status.textContent=t().coinsLoaded(coins.length);
  }catch{
    coins=SAMPLE.map(c=>({...c}));coins.forEach(c=>{if(!CMAP[c.id])CMAP[c.id]='other';});
    status.textContent=t().sampleData;
  }
  applyLang();
}

document.querySelectorAll('.lbtn').forEach(b=>{
  b.addEventListener('click',()=>{
    lang=b.dataset.lang;
    const url=new URL(location);url.searchParams.set('lang',lang);history.replaceState(null,'',url);
    applyLang();
  });
});
window.addEventListener('resize',()=>render());
load();
</script>
</body>
</html>
