<script>
/* ============================================================
   ★ 커스텀 API 교체 포인트
   나중에 직접 만든 API로 바꿀 때 아래 URL만 수정하면 됩니다.

   현재 응답 포맷 (배열):
   [
     {
       id: "bitcoin",                       // 코인 고유 ID
       symbol: "BTC",                       // 티커
       name: "Bitcoin",                     // 코인 이름
       current_price: 62000,               // 현재가 (USD)
       market_cap: 1220000000000,          // 시가총액
       price_change_percentage_24h: 1.2,   // 24h 등락률 (%)
       total_volume: 28000000000           // 24h 거래량
     },
     ...
   ]
============================================================ */
const API_URL = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=80&page=1&sparkline=false';


/* ============================================================
   카테고리 그룹 설정
   - id: 고유 키
   - label: 화면 표시 이름
   - color: 타일 배경색
   - order: 버튼 순서 (낮을수록 앞)
   - show: true = 초기 화면 버튼 노출 / false = 더보기
============================================================ */
const GROUPS = [
  { id:'layer1',        label:'레이어 1',        color:'#2563EB', order:1,  show:true  },
  { id:'layer2',        label:'레이어 2',         color:'#0891B2', order:2,  show:true  },
  { id:'defi',          label:'DeFi',            color:'#D97706', order:3,  show:true  },
  { id:'stablecoin',    label:'스테이블코인',     color:'#059669', order:4,  show:true  },
  { id:'meme',          label:'밈 코인',          color:'#DC2626', order:5,  show:true  },
  { id:'ai_data',       label:'AI / 빅데이터',    color:'#7C3AED', order:6,  show:true  },
  { id:'nft_gaming',    label:'NFT / 게임',       color:'#EA580C', order:7,  show:false },
  { id:'exchange',      label:'거래소 토큰',       color:'#1E293B', order:8,  show:false },
  { id:'privacy',       label:'프라이버시',        color:'#64748B', order:9,  show:false },
  { id:'rwa',           label:'RWA',             color:'#0F766E', order:10, show:false },
  { id:'infrastructure',label:'인프라 / 오라클',  color:'#B45309', order:11, show:false },
  { id:'other',         label:'기타',            color:'#6B7280', order:99, show:false },
];


/* ============================================================
   코인 → 카테고리 매핑
   key: coingecko_id / value: group id
============================================================ */
const CMAP = {
  'bitcoin':'layer1','ethereum':'layer1','solana':'layer1','ripple':'layer1',
  'cardano':'layer1','avalanche-2':'layer1','tron':'layer1','near':'layer1',
  'aptos':'layer1','cosmos':'layer1','polkadot':'layer1',
  'matic-network':'layer2','arbitrum':'layer2','optimism':'layer2','immutable-x':'layer2',
  'uniswap':'defi','aave':'defi','chainlink':'defi','maker':'defi','lido-dao':'defi',
  'tether':'stablecoin','usd-coin':'stablecoin','dai':'stablecoin',
  'dogecoin':'meme','shiba-inu':'meme','pepe':'meme',
  'fetch-ai':'ai_data','render-token':'ai_data','worldcoin-wld':'ai_data',
  'axie-infinity':'nft_gaming','the-sandbox':'nft_gaming','decentraland':'nft_gaming',
  'binancecoin':'exchange','okb':'exchange','crypto-com-chain':'exchange',
  'monero':'privacy','zcash':'privacy',
  'filecoin':'infrastructure','the-graph':'infrastructure','helium':'infrastructure',
  'litecoin':'other',
};


/* ============================================================
   이하 로직 — 일반적으로 수정 불필요
============================================================ */
const MAP_H = 500;
let coins = [], metric = 'market_cap', activeCat = 'all', showMore = false;

const chColor = v => {
  if (v > 5)   return '#059669';
  if (v > 2)   return '#10b981';
  if (v > .3)  return '#34d399';
  if (v > -.3) return '#94a3b8';
  if (v > -2)  return '#f87171';
  if (v > -5)  return '#ef4444';
  return '#b91c1c';
};
const gColor = id => (GROUPS.find(g => g.id === (CMAP[id]||'other')) || {color:'#6B7280'}).color;
const gLabel = id => (GROUPS.find(g => g.id === (CMAP[id]||'other')) || {label:'기타'}).label;
const gId    = id => CMAP[id] || 'other';

const fmtNum = (c, m) => {
  if (m === 'market_cap')                  return '$' + (c[m] / 1e9).toFixed(1) + 'B';
  if (m === 'current_price')               return c[m] < 0.01 ? '$' + c[m].toFixed(5) : '$' + c[m].toLocaleString('en', {maximumFractionDigits:2});
  if (m === 'price_change_percentage_24h') return (c[m] >= 0 ? '+' : '') + c[m].toFixed(2) + '%';
  if (m === 'total_volume')                return '$' + (c[m] / 1e9).toFixed(2) + 'B';
};

/* ── Squarify 트리맵 알고리즘 ── */
function squarify(items, x, y, w, h) {
  if (!items.length) return [];
  return _layout(items.map(i => ({...i})), x, y, w, h);
}
function _layout(items, x, y, w, h) {
  if (!items.length) return [];
  if (items.length === 1) return [{...items[0], x, y, w, h}];
  const tot = items.reduce((s,i) => s+i.a, 0);
  let best = 1, bR = Infinity;
  for (let n = 1; n <= items.length; n++) {
    const r = _worst(items.slice(0,n), w, h, tot);
    if (r < bR) { bR = r; best = n; } else break;
  }
  const row = items.slice(0, best), rest = items.slice(best);
  const rA = row.reduce((s,i) => s+i.a, 0), frac = rA / tot;
  let rects, nx, ny, nw, nh;
  if (w >= h) {
    const cw = w * frac; rects = _place(row,x,y,cw,h,false); nx=x+cw; ny=y; nw=w-cw; nh=h;
  } else {
    const rh = h * frac; rects = _place(row,x,y,w,rh,true);  nx=x; ny=y+rh; nw=w; nh=h-rh;
  }
  if (!rest.length) return rects;
  const na = nw*nh, rt = rest.reduce((s,i) => s+i.a, 0);
  return [...rects, ..._layout(rest.map(i => ({...i, a:i.a/rt*na})), nx, ny, nw, nh)];
}
function _worst(row, w, h, tot) {
  const rA = row.reduce((s,i) => s+i.a, 0), side = w>=h?h:w, rW = rA/tot*(w>=h?w:h);
  return row.reduce((m,i) => { const iH=(i.a/rA)*side; return Math.max(m, Math.max(rW/iH, iH/rW)); }, 0);
}
function _place(row, x, y, w, h, hz) {
  const tot = row.reduce((s,i) => s+i.a, 0); let cx=x, cy=y;
  return row.map(i => { const f=i.a/tot; const r=hz?{...i,x:cx,y:cy,w:w*f,h}:{...i,x:cx,y:cy,w,h:h*f}; hz?cx+=w*f:cy+=h*f; return r; });
}

/* ── 카테고리 버튼 ── */
function buildCatBar() {
  const bar = document.getElementById('cat-bar');
  bar.innerHTML = '';
  const sorted = [...GROUPS].sort((a,b) => a.order - b.order);
  const visible = showMore ? sorted : sorted.filter(g => g.show);

  const all = document.createElement('button');
  all.className = 'cbtn all-cbtn' + (activeCat==='all'?' on':'');
  all.textContent = '전체';
  all.onclick = () => { activeCat='all'; buildCatBar(); render(); };
  bar.appendChild(all);

  visible.forEach(g => {
    const b = document.createElement('button');
    b.className = 'cbtn' + (activeCat===g.id?' on':'');
    b.style.background = g.color;
    b.textContent = g.label;
    b.onclick = () => { activeCat=g.id; buildCatBar(); render(); };
    bar.appendChild(b);
  });

  if (sorted.some(g => !g.show)) {
    const m = document.createElement('button');
    m.className = 'more-cbtn';
    m.textContent = showMore ? '접기 ▲' : '더보기 ▼';
    m.onclick = () => { showMore=!showMore; buildCatBar(); };
    bar.appendChild(m);
  }
}

/* ── 트리맵 렌더링 ── */
function render() {
  const container = document.getElementById('map');
  container.innerHTML = '';
  const W = container.offsetWidth || 680;
  container.style.height = MAP_H + 'px';

  let data = coins.filter(c => c[metric] != null && Math.abs(c[metric]) > 0);
  if (activeCat !== 'all') data = data.filter(c => gId(c.id) === activeCat);
  if (!data.length) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:14px">표시할 코인 없음</div>';
    return;
  }

  data.sort((a,b) => Math.abs(b[metric]) - Math.abs(a[metric]));
  const tot = data.reduce((s,c) => s+Math.abs(c[metric]), 0);
  const items = data.map(c => ({ coin:c, a:Math.abs(c[metric])/tot*W*MAP_H }));
  const rects = squarify(items, 0, 0, W, MAP_H);
  const tip = document.getElementById('tip');

  rects.forEach(r => {
    const c = r.coin, ch = c.price_change_percentage_24h || 0;
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.cssText = `left:${r.x+.5}px;top:${r.y+.5}px;width:${Math.max(r.w-1,2)}px;height:${Math.max(r.h-1,2)}px;background:${gColor(c.id)};border-bottom:3px solid ${chColor(ch)}`;

    const minD = Math.min(r.w, r.h);
    if (minD > 24) {
      const s = document.createElement('div'); s.className='t-sym';
      s.style.fontSize = Math.min(Math.max(minD*.24,10),22)+'px';
      s.textContent = c.symbol.toUpperCase(); el.appendChild(s);
    }
    if (minD > 42) {
      const v = document.createElement('div'); v.className='t-val';
      v.style.fontSize = Math.min(Math.max(minD*.16,9),14)+'px';
      v.textContent = fmtNum(c, metric); el.appendChild(v);
    }
    if (minD > 64 && metric !== 'price_change_percentage_24h') {
      const cv = c.price_change_percentage_24h || 0;
      const chEl = document.createElement('div'); chEl.className='t-chg';
      chEl.style.fontSize = Math.min(Math.max(minD*.14,8),12)+'px';
      chEl.style.color = chColor(cv)+'dd';
      chEl.textContent = (cv>=0?'▲':'▼') + Math.abs(cv).toFixed(2)+'%';
      el.appendChild(chEl);
    }
    if (minD > 80 && activeCat === 'all') {
      const cat = document.createElement('div'); cat.className='t-cat';
      cat.textContent = gLabel(c.id); el.appendChild(cat);
    }

    el.addEventListener('mouseenter', () => {
      const cv = c.price_change_percentage_24h || 0;
      tip.style.display = 'block';
      tip.innerHTML = `
        <div class="tt-hd">${c.name}
          <span style="color:#94a3b8;font-size:11px;font-weight:400">${c.symbol.toUpperCase()}</span>
          <span class="tt-badge" style="background:${gColor(c.id)};margin-left:auto">${gLabel(c.id)}</span>
        </div>
        <div class="tt-r"><span>가격</span><span class="tt-v">${fmtNum(c,'current_price')}</span></div>
        <div class="tt-r"><span>시가총액</span><span class="tt-v">${fmtNum(c,'market_cap')}</span></div>
        <div class="tt-r"><span>24h 등락</span><span class="tt-v" style="color:${chColor(cv)}">${(cv>=0?'+':'')+cv.toFixed(2)+'%'}</span></div>
        <div class="tt-r"><span>거래량 24h</span><span class="tt-v">${fmtNum(c,'total_volume')}</span></div>`;
    });
    el.addEventListener('mousemove', e => {
      tip.style.left = (e.clientX+14)+'px';
      tip.style.top  = (e.clientY-10)+'px';
    });
    el.addEventListener('mouseleave', () => tip.style.display='none');
    container.appendChild(el);
  });
}
